[package]
name = "erisharness"
version = "0.1.0"
edition = "2024"

[dependencies]
erissandbox = { git = "https://github.com/Eriskii/ErisSandbox" }
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs", "user"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "http2", "gzip", "brotli", "deflate", "zstd"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
httpdate = "1.0.3"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7.19"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
axum = "0.8.9"
libtest-mimic = "0.8.2"
tempfile = "3.27.0"

[[test]]
name = "tools"
harness = false

[[test]]
name = "agent"
harness = false
